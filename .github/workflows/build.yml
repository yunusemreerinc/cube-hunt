name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # dist/index.html is the whole game in one file; it runs by double-clicking it.
      - run: cp dist/index.html cube-hunt.html
      - uses: actions/upload-artifact@v4
        with:
          name: cube-hunt
          path: cube-hunt.html
          retention-days: 30
